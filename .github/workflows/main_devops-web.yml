
name: Build and Deploy WAR to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft

      - name: Build WAR
        run: mvn clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/velocity-motors.war

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-app
          path: ./deployment

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9430B5FDC5714E18AEA216E1F4098228 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F6F1EF126C0040E08AA31AC12130FE80 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9B3FA04BA2D470B8AB88E105DB5E961 }}

      - name: Deploy WAR
        uses: azure/webapps-deploy@v3
        with:
          app-name: devops-web
          slot-name: Production
          package: ./deployment/velocity-motors.war
